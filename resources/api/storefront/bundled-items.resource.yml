resource:
    name: BundledItems
    shortName: bundled-items
    description: 'Component items of a bundle — children of a bundle-items resource.'

    paginationEnabled: false

    includes:
        - relationshipName: concrete-products
          targetResource: ConcreteProducts
          uriTemplate: /concrete-products/{sku}
          uriVariableMappings:
              sku: sku

    properties:
        groupKey:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Stable hash that identifies this component item inside the bundle. The parent bundle exposes the same `groupKey` on its `BundleItems` representation, which links a bundled-item back to the bundle it belongs to.'
            openapiContext:
                example: 'bundle-group-key-example'

        sku:
            type: string
            writable: false
            readable: true
            required: false
            description: 'SKU of the concrete component product packaged inside the bundle (one row per component, even if the bundle template lists the same component twice).'
            openapiContext:
                example: '218_456'

        quantity:
            type: integer
            writable: false
            readable: true
            required: false
            description: 'How many copies of this component the bundle template ships per bundle, multiplied by the bundle quantity in the cart (i.e. `bundleTemplate.componentQuantity * BundleItems.quantity`).'
            openapiContext:
                example: 2

        abstractSku:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Abstract-product SKU the component concrete belongs to.'
            openapiContext:
                example: '218'

        amount:
            type: integer
            writable: false
            readable: true
            required: false
            description: 'Measurement amount per component for measurable products (e.g. number of kilograms or litres); `null` for ordinary count-based components.'
            openapiContext:
                example: null

        calculations:
            type: object
            objectName: Calculations
            writable: false
            readable: true
            required: false
            description: 'Calculated component prices and totals in cents — `unitPrice`/`sumPrice` are the listed price aggregated to the line, `unitGrossPrice`/`unitNetPrice` and their `sum*` siblings break the totals into gross/net for the configured `priceMode`, `unitDiscountAmountAggregation` and `sumDiscountAmountAggregation` carry per-component discount totals.'
            properties:
                unitPrice:
                    type: integer
                    description: 'Listed unit price in cents.'
                    openapiContext:
                        example: 4950
                sumPrice:
                    type: integer
                    description: 'Listed price aggregated to the line in cents.'
                    openapiContext:
                        example: 9900
                unitGrossPrice:
                    type: integer
                    description: 'Gross unit price in cents.'
                    openapiContext:
                        example: 4950
                sumGrossPrice:
                    type: integer
                    description: 'Gross price aggregated to the line in cents.'
                    openapiContext:
                        example: 9900
                unitNetPrice:
                    type: integer
                    description: 'Net unit price in cents.'
                    openapiContext:
                        example: 4159
                sumNetPrice:
                    type: integer
                    description: 'Net price aggregated to the line in cents.'
                    openapiContext:
                        example: 8319
                unitDiscountAmountAggregation:
                    type: integer
                    description: 'Per-unit discount total in cents.'
                    openapiContext:
                        example: 495
                sumDiscountAmountAggregation:
                    type: integer
                    description: 'Aggregated discount total in cents.'
                    openapiContext:
                        example: 990
                taxRate:
                    type: integer
                    description: 'Tax rate applied to the item, in percent.'
                    openapiContext:
                        example: 19
                unitTaxAmountFullAggregation:
                    type: integer
                    description: 'Aggregated tax amount per unit in cents.'
                    openapiContext:
                        example: 635
                sumTaxAmountFullAggregation:
                    type: integer
                    description: 'Aggregated tax amount for the sum in cents.'
                    openapiContext:
                        example: 635
                unitPriceToPayAggregation:
                    type: integer
                    description: 'Price to pay per unit after all aggregations, in cents.'
                    openapiContext:
                        example: 3616
                sumPriceToPayAggregation:
                    type: integer
                    description: 'Price to pay for the sum after all aggregations, in cents.'
                    openapiContext:
                        example: 3616
                unitSubtotalAggregation:
                    type: integer
                    description: 'Aggregated subtotal per unit in cents.'
                    openapiContext:
                        example: 3979
                sumSubtotalAggregation:
                    type: integer
                    description: 'Aggregated subtotal for the sum in cents.'
                    openapiContext:
                        example: 3979
                unitDiscountAmountFullAggregation:
                    type: integer
                    description: 'Fully aggregated discount amount per unit in cents.'
                    openapiContext:
                        example: 363
                sumDiscountAmountFullAggregation:
                    type: integer
                    description: 'Fully aggregated discount amount for the sum in cents.'
                    openapiContext:
                        example: 363
                unitProductOptionPriceAggregation:
                    type: integer
                    description: 'Aggregated product option price per unit in cents.'
                    openapiContext:
                        example: 0
                sumProductOptionPriceAggregation:
                    type: integer
                    description: 'Aggregated product option price for the sum in cents.'
                    openapiContext:
                        example: 0
